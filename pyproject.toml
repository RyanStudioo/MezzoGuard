[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "mezzo-guard"
dynamic = ["version"]
description = "Mezzo Guard is a Python SDK designed to provide AI-based content moderation and security for applications."
requires-python = ">=3.11"
dependencies = [
    "transformers>=4.51,<6",
    "huggingface_hub>=0.25",
]
readme = "README.md"
authors = [
    {name="Ryan Studio", email="ryanstudiobusiness@gmail.com"}
]
maintainers = [
    {name="Ryan Studio", email="ryanstudiobusiness@gmail.com"}
]
keywords = [
    # Name Related
    "mezzo guard", "mezzo", "mezzo prompt guard", "mezzo content guard", "mezzo moderation guard", "mezzo jailbreak guard", "mezzo ai", "mezzo security",

    # AI Related
    "LLM", "ai", "artificial intelligence", "ai model", "language model", "inference",

    # Security Related
    "security", "jailbreak", "prompt injection", "prompt guard", "guard", "content guard", "content moderation", "moderation", "ai moderation",

    # General Keywords
    "content safety", "ai safety", "model safety", "application security", "python sdk", "sdk"
]

[project.optional-dependencies]
onnx = ["optimum[onnxruntime]"]
server = ["fastapi>=0.115,<1", "uvicorn[standard]>=0.30,<1"]
client = ["httpx>=0.27,<1"]

[project.scripts]
mezzo-guard = "mezzoguard.cli:main"

[tool.hatch.version]
path = "src/mezzoguard/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/mezzoguard"]

[tool.hatch.build.targets.wheel.force-include]
"src/mezzoguard/py.typed" = "mezzoguard/py.typed"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = ["UP007"]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "ruff>=0.16.3",
    "httpx>=0.27,<1",
    "fastapi>=0.115,<1",
    "uvicorn[standard]>=0.30,<1",
]
